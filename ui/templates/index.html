<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Face Tracker Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #4CAF50;
        }
        .dashboard {
            display: flex;
            flex-direction: row;
            gap: 20px;
            margin-top: 20px;
        }
        .video-container {
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .stats-container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            min-width: 250px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .stat-box {
            text-align: center;
            margin-bottom: 20px;
        }
        .stat-value {
            font-size: 3em;
            font-weight: bold;
            color: #2196F3;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Face Tracker Dashboard</h1>
    <div class="dashboard">
        <div class="video-container">
            <!-- Ensure src is pointing to our Flask endpoint -->
            <img src="/video_feed" width="800" height="450" alt="Video Stream">
        </div>
        <div class="stats-container">
            <div class="stat-box">
                <h2>Total Unique Visitors</h2>
                <div class="stat-value" id="uniqueCount">0</div>
            </div>
            <!-- More stats can be added here -->
        </div>
    </div>

    <script>
        function fetchStats() {
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('uniqueCount').innerText = data.unique_visitors;
                    }
                })
                .catch(err => console.error('Error fetching stats:', err));
        }

        // Fetch stats every 2 seconds
        setInterval(fetchStats, 2000);
        fetchStats(); // Initial fetch
    </script>
</body>
</html>
